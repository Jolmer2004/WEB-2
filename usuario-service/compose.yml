services:
  postgres:
    image: postgres:16
    container_name: postgres-yemm
    environment:
      POSTGRES_DB: yemm_db
      POSTGRES_USER: devdb
      POSTGRES_PASSWORD: a1b2c3d4
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: